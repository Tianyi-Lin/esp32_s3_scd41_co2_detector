[env:esp32-s3-lcd-147b]
platform = espressif32
; This board definition matches the Waveshare module exactly: ESP32-S3R8,
; 16 MB QIO flash and 8 MB OPI PSRAM.  The generic DevKitC-N8 profile
; boots unreliably on this memory layout.
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino

; Waveshare ESP32-S3-LCD-1.47B: 16 MB Flash + 8 MB PSRAM.
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; The board uses the ESP32-S3 native USB port for flashing and Serial Monitor.
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_rts = 0
monitor_dtr = 0

lib_deps =
    sensirion/Sensirion I2C SCD4x@^1.1.0
    moononournation/GFX Library for Arduino@1.5.9
